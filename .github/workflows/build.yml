name: Build StarT Core

on:
  pull_request:
    paths: ['**']
    types: [opened, synchronize, reopened, labeled]
  
jobs:
  build:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'build')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      GITHUB_ACTOR: trulyno

    steps:
    - uses: actions/checkout@v4
    - run: git fetch origin develop --no-tags --depth=1
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build -PMAVEN_USERNAME=${{ secrets.MAVEN_USERNAME }} -PMAVEN_TOKEN=${{ secrets.MAVEN_TOKEN }}

    - name: Upload jar as Artifact
      uses: actions/upload-artifact@v4.4.3
      with:
        # Artifact name
        name: star-technology-core-libs
        # A file, directory or wildcard pattern that describes what to upload
        path: ./build/libs/

    - name: Send Discord notification
      shell: bash
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.discord_webhook_url }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        # Only send notification if webhook URL is provided
        if [ -z "$DISCORD_WEBHOOK_URL" ]; then
          echo "⚠️ Discord webhook URL not provided, skipping notification"
          exit 0
        fi

        # Calculate expiry date (retention-days from now)
        EXPIRY_DATE=$(date -u -d "+30 days" "+%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u -v+30d "+%Y-%m-%dT%H:%M:%SZ")
        EXPIRY_UNIX=$(date -u -d "+30 days" "+%s" 2>/dev/null || date -u -v+30d "+%s")
        
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        ARTIFACT_NAME="StarT-Core-${{ env.BRANCH_NAME }}"

        RESPONSE=$(curl -s -X POST "$DISCORD_WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"✅ Build Ready: ${ARTIFACT_NAME}\",
              \"description\": \"A new build has been compiled and uploaded.\",
              \"color\": 5763719,
              \"fields\": [
                {
                  \"name\": \"📦 Download Artifact\",
                  \"value\": \"[View on GitHub Actions](${RUN_URL})\",
                  \"inline\": false
                },
                {
                  \"name\": \"⏳ Expires\",
                  \"value\": \"<t:${EXPIRY_UNIX}:F> (<t:${EXPIRY_UNIX}:R>)\",
                  \"inline\": false
                },
                {
                  \"name\": \"🌿 Branch\",
                  \"value\": \"\`${{ env.BRANCH_NAME }}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"🔁 Run\",
                  \"value\": \"[#${{ github.run_number }}](${RUN_URL})\",
                  \"inline\": true
                }
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" -w "\n%{http_code}")
        
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        if [ "$HTTP_CODE" = "204" ]; then
          echo "✅ Discord notification sent successfully"
        else
          echo "❌ Failed to send Discord notification (HTTP $HTTP_CODE)"
          echo "Response: $(echo "$RESPONSE" | head -n-1)"
          exit 1
        fi
